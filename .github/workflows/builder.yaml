name: Build HA add-on

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

env:
  APP_DIR: plants

permissions:
  contents: read

jobs:
  build-app:
    name: Build add-on
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ env.APP_DIR }}
      publish: true
    secrets: inherit
