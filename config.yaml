name: "Rośliny"
version: "0.1.4"
slug: plants
description: "Zarządzanie roślinami domowymi: zdjęcia, timeline, podlewanie/nawożenie, czujniki MQTT, integracja z OpenPlantBook i planami pielęgnacji AI."
url: "https://github.com/batas/plantastic"
image: "ghcr.io/batas/plantastic/plants"
arch:
  - aarch64
  - amd64
init: false
ingress: false
ports:
  3000/tcp: 3000
startup: application
boot: auto
stage: experimental
hassio_api: true
homeassistant_api: true
host_network: false
options:
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  llm_provider: ollama
  llm_model: ""
  llm_base_url: ""
  llm_api_key: ""
  opb_client_id: ""
  opb_secret: ""
  reminder_enabled: true
schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: str
  llm_provider: "list(openai|anthropic|ollama|litellm)"
  llm_model: str
  llm_base_url: str
  llm_api_key: str
  opb_client_id: str
  opb_secret: str
  reminder_enabled: bool
